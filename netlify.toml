[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://overleg.boaportaal.nl"
    Access-Control-Allow-Headers = "authorization, content-type"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "poort"
  path = "/*"
