<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Systeembeheer & audit | BOA Portaal</title>
  <style>
    :root { --navy:#0b1220; --actie:#1d4ed8; --veld:#0f172a; --kaart:#111827; --lijn:#334155; --tekst:#e5e7eb; --muted:#94a3b8; --warn:#fbbf24; --crit:#fca5a5; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 ui-monospace, "Segoe UI", sans-serif; background:var(--veld); color:var(--tekst); }
    header { background:#020617; border-bottom:1px solid var(--lijn); padding:14px 18px; }
    header strong { letter-spacing:.06em; }
    main { max-width:1180px; margin:0 auto; padding:18px 14px 48px; }
    h1 { font-size:20px; margin:0 0 8px; }
    .kaart { background:var(--kaart); border:1px solid var(--lijn); padding:14px; margin-top:12px; }
    label { display:grid; gap:4px; margin-bottom:10px; color:var(--muted); font-size:12px; }
    input, select, textarea { font:inherit; color:var(--tekst); background:#020617; border:1px solid var(--lijn); padding:8px; width:100%; }
    textarea { min-height:80px; }
    .rij { display:flex; flex-wrap:wrap; gap:8px; }
    button { font:inherit; cursor:pointer; background:var(--actie); color:#fff; border:0; padding:8px 12px; }
    button.sec { background:transparent; border:1px solid var(--lijn); color:var(--tekst); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .balk { background:#7f1d1d; color:#fff; padding:12px; border:1px solid #fecaca; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; }
    .meta div { border:1px solid var(--lijn); padding:8px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border:1px solid var(--lijn); padding:6px; text-align:left; vertical-align:top; }
    .fout { color:var(--crit); } .ok { color:#86efac; }
    .tabs button.aan { outline:2px solid #fff; }
  </style>
</head>
<body>
  <header>
    <strong>SYSTEEMBEHEER & AUDIT | BOA PORTAAL</strong>
    <div style="color:#94a3b8;font-size:12px">Zoeken op ticket of Client-ID. E-mail blijft standaard dicht. Kluisinhoud is niet leesbaar.</div>
  </header>
  <main id="app"></main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.1";
    const URL = "https://ofzyqwpztohflxdhqgbb.supabase.co";
    const KEY = "sb_publishable_x8nU8ype6b1KOL6K8lS2Iw_DDjz4Olr";
    const sb = createClient(URL, KEY);
    const app = document.querySelector("#app");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&" + "amp;", "<": "&" + "lt;", ">": "&" + "gt;", '"': "&" + "quot;", "'": "&" + "#39;"}[c]));
    let ik = null, tab = "zoek", dossier = null, overzicht = { inlog: [], register: [], ip_zichtbaar: false }, fout = "", melding = "", glas = false;
    let totp = null;
    let bronF = "", soortF = "", niveauF = "", dagenF = "30", qF = "";

    async function tweedeStap() {
      const niveau = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (niveau.error) return "uit";
      if (niveau.data.currentLevel === "aal2") return "klaar";
      const lijst = await sb.auth.mfa.listFactors();
      if (lijst.error) return "uit";
      const bevestigd = (lijst.data?.totp || []).filter((f) => f.status === "verified");
      if (bevestigd[0]) { totp = { modus: "code", factorId: bevestigd[0].id, qr: "", geheim: "" }; return "wacht"; }
      for (const factor of lijst.data?.all || []) {
        if (factor.status !== "verified") await sb.auth.mfa.unenroll({ factorId: factor.id });
      }
      const vers = await sb.auth.mfa.enroll({ factorType: "totp", issuer: "BOA Systeem" });
      if (vers.error || !vers.data?.totp) return "uit";
      totp = { modus: "setup", factorId: vers.data.id, qr: vers.data.totp.qr_code, geheim: vers.data.totp.secret };
      return "wacht";
    }

    function totpHtml() {
      const setup = totp.modus === "setup";
      return `<h1>${setup ? "Authenticator instellen" : "Authenticator"}</h1>
        <form id="totp" class="kaart">
          <p>${setup ? "Scan de code met Google Authenticator. Daarna de 6 cijfers. Elke nieuwe aanmelding vraagt dit opnieuw." : "Vul de 6 cijfers uit je authenticator in. Elke nieuwe aanmelding vraagt dit opnieuw."}</p>
          ${setup && totp.qr ? `<p><img src="${esc(totp.qr)}" alt="QR-code" width="180" height="180"></p>` : ""}
          ${setup && totp.geheim ? `<p>Lukt scannen niet, typ dan deze sleutel: ${esc(totp.geheim)}</p>` : ""}
          <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456"></label>
          <button>Bevestigen</button>
          <p class="fout">${esc(fout)}</p>
        </form>`;
    }

    async function vernieuw() {
      const { data } = await sb.auth.getSession();
      if (!data.session) { ik = null; totp = null; return; }
      if (!totp) {
        const stap = await tweedeStap();
        if (stap === "wacht") return;
        if (stap === "uit") {
          await sb.auth.signOut();
          ik = null;
          fout = "Tweestaps is nog niet aangezet in het accountsysteem. Zet TOTP aan bij Authentication en log opnieuw in.";
          return;
        }
      }
      const { data: prof, error } = await sb.rpc("boa_ik");
      if (error) {
        ik = null;
        fout = error.message.includes("function") || error.message.includes("schema")
          ? "Het identiteitsregister is nog niet actief. Draai schema.sql in Supabase."
          : error.message;
        return;
      }
      ik = prof;
    }

    function login() {
      return `<h1>Aanmelden</h1><form id="login" class="kaart">
        <label>Zakelijk adres van de medewerker<input type="email" name="email" required></label>
        <label>Wachtwoord<input type="password" name="password" required></label>
        <button>Inloggen</button><p class="fout">${esc(fout)}</p></form>`;
    }

    function zoek() {
      return `<h1>Dossier opvragen</h1>
        <form id="zoek" class="kaart">
          <label>Ticketnummer of Client-ID<input name="sleutel" placeholder="M2611-0412 of BP-8492-NL" required pattern="(BP-[0-9]{4}-[A-Za-z]{2}|M[0-9]{4}-[0-9]{4})"></label>
          <label>Wettelijke/operationele reden van opvraag (verplicht voor het auditlog)<textarea name="reden" required minlength="12" placeholder="Verzoek wachtwoordreset n.a.v. ticket M2611-0412"></textarea></label>
          <button id="zoek-knop">Zoeken</button>
        </form>
        ${ik.medewerker ? `<form id="glas" class="kaart"><label><input id="glas-aan" type="checkbox" ${glas ? "checked" : ""}> Zoeken op e-mailadres</label>
          ${glas ? `<p>HIGH ALERT. Deze opvraag schrijft een zware regel in het auditregister. Het adres komt niet terug in het dossier.</p><label>Zakelijk adres<input type="email" name="email" required></label><label>Reden<textarea name="reden" required minlength="12"></textarea></label><button>Nood-opvraag uitvoeren</button>` : ""}</form>` : ""}
        ${dossier ? dossierHtml() : ""}
        <p class="fout">${esc(fout)}</p><p class="ok">${esc(melding)}</p>`;
    }

    function dossierHtml() {
      const d = dossier;
      const items = d.kluis || {};
      const regels = Object.entries(items);
      const totaal = regels.reduce((n, [, a]) => n + Number(a), 0);
      return `<div class="balk">LET OP: Deze inzage op dossier [${esc(d.client_id)} | ${esc(d.pv_naam)}] is op ${esc(d.moment)} geregistreerd in het auditlogboek op naam van [${esc(d.beheerder)}] met reden: '${esc(d.reden)}'.</div>
        <div class="kaart"><h2>${esc(d.pv_naam)} · ${esc(d.client_id)}</h2>
          <p>Organisatie: ${esc(d.organisatie || "—")} · Status account: ${d.locked ? "LOCKED" : "ACTIEF"}</p>
          <h3>Persoonlijke versleutelde kluis (zero-knowledge)</h3>
          <div class="meta">
            <div>Status kluis<br><b>ACTIEF & VERSLEUTELD (AES-256-GCM)</b></div>
            <div>Bevat items<br><b>${totaal ? `Ja (${regels.map(([k,a]) => `${a} ${esc(k)}`).join(", ")})` : "Geen items"}</b></div>
            <div>Laatste synchronisatie<br><b>${d.laatste_sync ? esc(new Date(d.laatste_sync).toLocaleString("nl-NL")) : "—"}</b></div>
            <div>Inhoud<br><b>AFGESCHERMD — GEEN SLEUTELTOEGANG VOOR BEHEER</b></div>
          </div>
          <div class="rij" style="margin-top:12px">
            <button id="reset" type="button">Herstel-link sturen</button>
            ${ik.rol === "beheerder" ? `<button id="lock" type="button" class="sec">${d.locked ? "Account ontgrendelen" : "Account vergrendelen"}</button>` : ""}
          </div>
          ${ik.rol === "beheerder" ? `<form id="wachtwoord" style="margin-top:14px">
            <h3>Wachtwoord direct zetten</h3>
            <p>De persoon krijgt geen mail. Jij kiest het wachtwoord en geeft het zelf door. Het wachtwoord komt niet in het auditlog.</p>
            <label>Nieuw wachtwoord<input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
            <label>Herhaal wachtwoord<input type="password" name="again" required minlength="12" autocomplete="new-password"></label>
            <label>Reden<textarea name="reden" required minlength="12" placeholder="Balie, medewerker kan de herstelmail niet openen"></textarea></label>
            <button>Wachtwoord zetten</button>
          </form>` : `<p>Een herstel-link gaat naar het zakelijke adres. Het adres blijft buiten beeld. Direct een wachtwoord zetten kan alleen de hoofdbeheerder.</p>`}
        </div>
        ${activiteitHtml(d)}`;
    }

    function activiteitHtml(d) {
      const ip = Boolean(d.ip_zichtbaar);
      const inlog = d.inlog || [];
      const hand = d.handelingen || [];
      return `<div class="kaart"><h3>Laatste 30 dagen, audit</h3>
        <p>Inlogpogingen op boaportaal.nl, servicedesk en dit systeem.</p>
        ${d.auditFout ? `<p class="fout">${esc(d.auditFout)}</p>` : ""}
        <table><thead><tr><th>Moment</th><th>Bron</th><th>Uitkomst</th>${ip ? "<th>IP</th>" : ""}</tr></thead><tbody>
          ${inlog.length ? inlog.map((r) => `<tr><td>${esc(new Date(r.moment).toLocaleString("nl-NL"))}</td><td>${esc(r.bron)}</td><td>${esc(r.resultaat)}</td>${ip ? `<td>${esc(r.ip || "—")}</td>` : ""}</tr>`).join("") : `<tr><td colspan="${ip ? 4 : 3}">Geen inlogpogingen in 30 dagen.</td></tr>`}
        </tbody></table>
        <h3>Registerhandelingen</h3>
        <table><thead><tr><th>Moment</th><th>Bron</th><th>Soort</th><th>Niveau</th><th>Wie</th><th>Reden</th></tr></thead><tbody>
          ${hand.length ? hand.map((r) => `<tr><td>${esc(new Date(r.moment).toLocaleString("nl-NL"))}</td><td>${esc(r.bron)}</td><td>${esc(r.soort)}</td><td>${esc(r.niveau)}</td><td>${esc(r.beheerder)} · ${esc(r.rol_in_regel)}</td><td>${esc(r.reden)}</td></tr>`).join("") : `<tr><td colspan="6">Geen registerregels in 30 dagen.</td></tr>`}
        </tbody></table>
        ${ik.rol === "beheerder" ? `<form id="email" style="margin-top:12px">
          <h3>Zakelijk adres wijzigen</h3>
          <p>Alleen de hoofdbeheerder. Het nieuwe adres komt niet terug in het scherm en niet in het auditlog.</p>
          <label>Nieuw zakelijk adres<input type="email" name="email" required></label>
          <label>Reden<textarea name="reden" required minlength="12" placeholder="Adreswijziging op verzoek van de medewerker, ticket M2611-0412"></textarea></label>
          <button>Adres wijzigen</button>
        </form>` : ""}
      </div>`;
    }

    function medewerkers() {
      const portaal = `<h1>Account voor boaportaal.nl</h1>
        <form id="gebruiker" class="kaart">
          <p>Support en de hoofdbeheerder. Dit account kan in op boaportaal.nl. Het krijgt geen recht op de servicedesk.</p>
          <label>PV-naam<input name="pv_naam" placeholder="DE VRIES, M.A." required></label>
          <label>Zakelijk adres (alleen voor het aanmaken, daarna niet meer zichtbaar)<input type="email" name="email" required></label>
          <label>Startwachtwoord<input type="password" name="password" required minlength="12"></label>
          <button>Account aanmaken</button>
        </form>`;
      const staf = ik.rol === "beheerder" ? `<h2>Medewerker voor de servicedesk</h2><form id="medewerker" class="kaart">
        <p>Alleen de hoofdbeheerder. Dit account krijgt een rol op de servicedesk en in dit systeem.</p>
        <label>PV-naam<input name="pv_naam" placeholder="DE VRIES, M.A." required></label>
        <label>Zakelijk adres (alleen voor het aanmaken, daarna niet meer zichtbaar)<input type="email" name="email" required></label>
        <label>Startwachtwoord<input type="password" name="password" required minlength="12"></label>
        <label>Rol<select name="rol"><option value="support">Support (1e lijn)</option><option value="beheerder">Beheerder (2e lijn)</option></select></label>
        <button>Medewerker aanmaken</button>
      </form>` : "";
      return `${portaal}${staf}<p class="fout">${esc(fout)}</p><p class="ok">${esc(melding)}</p>`;
    }

    function auditHtml() {
      const ip = Boolean(overzicht.ip_zichtbaar);
      const inlog = overzicht.inlog || [];
      const register = overzicht.register || [];
      const opt = (waarde, label, huidig) => `<option value="${waarde}" ${huidig === waarde ? "selected" : ""}>${label}</option>`;
      return `<h1>Audit-overzicht</h1>
        <form id="filter" class="kaart">
          <div class="rij">
            <label>Bron<select name="bron">
              ${opt("", "Alle sites", bronF)}
              ${opt("portaal", "boaportaal.nl", bronF)}
              ${opt("servicedesk", "servicedesk.boaportaal.nl", bronF)}
              ${opt("systeem", "systeem.boaportaal.nl", bronF)}
              ${opt("mail", "mail.boaportaal.nl", bronF)}
            </select></label>
            <label>Soort<select name="soort">
              ${opt("", "Alle soorten", soortF)}
              ${opt("INZAGE", "Inzage", soortF)}
              ${opt("BREAK_GLASS", "Nood-opvraag", soortF)}
              ${opt("CRITICAL_AUTH_CHANGE", "Auth-wijziging", soortF)}
              ${opt("MAIL_VERZONDEN", "Mail verzonden", soortF)}
              ${opt("MAIL_CLAIM", "Mail geclaimd", soortF)}
              ${opt("MAIL_UNCLAIM", "Claim losgelaten", soortF)}
            </select></label>
            <label>Niveau<select name="niveau">
              ${opt("", "Alle niveaus", niveauF)}
              ${opt("INFO", "INFO", niveauF)}
              ${opt("HIGH", "HIGH", niveauF)}
              ${opt("CRITICAL", "CRITICAL", niveauF)}
            </select></label>
            <label>Periode<select name="dagen">
              ${opt("7", "7 dagen", dagenF)}
              ${opt("30", "30 dagen", dagenF)}
              ${opt("90", "90 dagen", dagenF)}
            </select></label>
            <label>Client-ID of ticket<input name="q" value="${esc(qF)}" placeholder="BP- of M"></label>
          </div>
          <button>Filter</button>
        </form>
        <p class="fout">${esc(fout)}</p>
        <h2>Inlogpogingen</h2>
        <table><thead><tr><th>Moment</th><th>Bron</th><th>Dossier</th><th>Uitkomst</th>${ip ? "<th>IP</th>" : ""}</tr></thead><tbody>
          ${inlog.length ? inlog.map((r) => `<tr><td>${esc(new Date(r.moment).toLocaleString("nl-NL"))}</td><td>${esc(r.bron)}</td><td>${esc(r.pv_naam)} ${esc(r.client_id)}</td><td>${esc(r.resultaat)}</td>${ip ? `<td>${esc(r.ip || "—")}</td>` : ""}</tr>`).join("") : `<tr><td colspan="${ip ? 5 : 4}">Geen inlogpogingen in deze selectie.</td></tr>`}
        </tbody></table>
        <h2>Register</h2>
        <table><thead><tr><th>Moment</th><th>Bron</th><th>Beheerder</th><th>Dossier</th><th>Ticket</th><th>Soort</th><th>Niveau</th><th>Reden</th></tr></thead><tbody>
          ${register.length ? register.map((a) => `<tr><td>${esc(new Date(a.moment).toLocaleString("nl-NL"))}</td><td>${esc(a.bron || "systeem")}</td><td>${esc(a.beheerder_naam)} ${esc(a.beheerder_id)}</td><td>${esc(a.doel_pv_naam)} ${esc(a.doel_client_id)}</td><td>${esc(a.ticketnummer)}</td><td>${esc(a.soort)}</td><td>${esc(a.niveau)}</td><td>${esc(a.reden)}</td></tr>`).join("") : `<tr><td colspan="8">Geen registerregels in deze selectie.</td></tr>`}
        </tbody></table>`;
    }

    function schil() {
      return `<div class="rij tabs">
        <button class="sec ${tab==="zoek"?"aan":""}" data-tab="zoek">Opvragen</button>
        <button class="sec ${tab==="mensen"?"aan":""}" data-tab="mensen">Accounts</button>
        <button class="sec ${tab==="audit"?"aan":""}" data-tab="audit">Audit</button>
        <button class="sec" id="uit">Afmelden ${esc(ik.client_id)}</button>
      </div>
      <p>${esc(ik.rol)} · ${esc(ik.pv_naam)} · ${esc(ik.client_id)}</p>
      ${tab==="zoek" ? zoek() : tab==="mensen" ? medewerkers() : auditHtml()}`;
    }

    async function laad30() {
      if (!dossier?.client_id) return;
      const { data, error } = await sb.rpc("boa_dossier_30", { p_client_id: dossier.client_id });
      if (error) {
        dossier.inlog = [];
        dossier.handelingen = [];
        dossier.auditFout = error.message.includes("function") ? "Draai migrations/0005_audit_inlog.sql in Supabase." : error.message;
        return;
      }
      dossier.inlog = data?.inlog || [];
      dossier.handelingen = data?.handelingen || [];
      dossier.ip_zichtbaar = Boolean(data?.ip_zichtbaar);
      dossier.auditFout = "";
    }

    function noteerInlog(token, email) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = `Bearer ${token}`;
      void fetch("/.netlify/functions/inlog", { method: "POST", headers, body: JSON.stringify({ bron: "systeem", email: email || "" }) });
    }

    async function token() {
      const { data } = await sb.auth.getSession();
      return data.session?.access_token || "";
    }

    async function teken() {
      if (totp) { app.innerHTML = totpHtml(); bind(); return; }
      if (!ik) { app.innerHTML = login(); bind(); return; }
      if (!ik.medewerker) {
        app.innerHTML = `<div class="kaart"><h1>Geen toegang</h1><p>${esc(ik.pv_naam)} ${esc(ik.client_id)} is geen medewerker. Een hoofdbeheerder maakt het account aan.</p><button id="uit">Afmelden</button></div>`;
        document.getElementById("uit").onclick = async () => { await sb.auth.signOut(); ik = null; teken(); };
        return;
      }
      if (tab === "audit") {
        const { data, error } = await sb.rpc("boa_overzicht", {
          p_bron: bronF,
          p_soort: soortF,
          p_niveau: niveauF,
          p_dagen: Number(dagenF),
          p_q: qF,
        });
        const ongefilterd = !bronF && !soortF && !niveauF && !qF;
        const leeg = !data || ((!data.register || !data.register.length) && (!data.inlog || !data.inlog.length));
        if (error || (ongefilterd && leeg)) {
          const oud = await sb.rpc("boa_audit_lijst");
          if (!oud.error && Array.isArray(oud.data) && oud.data.length) {
            overzicht = { ip_zichtbaar: ik.rol === "beheerder", inlog: data?.inlog || [], register: oud.data };
            fout = "";
          } else if (error) {
            fout = error.message.includes("function") ? "Draai schema-0005.sql in Supabase." : error.message;
          } else if (data) {
            overzicht = data;
            fout = "";
          }
        } else {
          overzicht = data;
          fout = "";
        }
      }
      app.innerHTML = schil();
      bind();
    }

    function bind() {
      document.getElementById("login")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        fout = "";
        const email = String(f.get("email")).trim();
        const { data, error } = await sb.auth.signInWithPassword({ email, password: String(f.get("password")) });
        if (error || !data.session) {
          noteerInlog("", email);
          fout = error ? "Aanmelden lukt niet." : "Sessie niet opgeslagen.";
          teken();
          return;
        }
        totp = null;
        await vernieuw();
        if (totp) { teken(); return; }
        noteerInlog(data.session.access_token, "");
        if (!ik && !fout) fout = "Aangemeld, maar het dossier is niet geladen.";
        teken();
      });
      document.getElementById("totp")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const code = String(new FormData(e.target).get("code") || "").replace(/\s/g, "");
        fout = "";
        const uitdaging = await sb.auth.mfa.challenge({ factorId: totp.factorId });
        if (uitdaging.error) { fout = "De code kon niet worden gevraagd."; teken(); return; }
        const check = await sb.auth.mfa.verify({ factorId: totp.factorId, challengeId: uitdaging.data.id, code });
        if (check.error) { fout = "Die code klopt niet."; teken(); return; }
        totp = null;
        const sessie = await sb.auth.getSession();
        noteerInlog(sessie.data.session?.access_token || "", "");
        await vernieuw();
        teken();
      });
      document.getElementById("uit")?.addEventListener("click", async () => { await sb.auth.signOut(); ik = null; dossier = null; teken(); });
      document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; fout = ""; melding = ""; teken(); }));
      const form = document.getElementById("zoek");
      const knop = document.getElementById("zoek-knop");
      const sync = () => {
        if (!form || !knop) return;
        const sleutel = form.sleutel.value.trim();
        const reden = form.reden.value.trim();
        knop.disabled = reden.length < 12 || !/^(BP-\d{4}-[A-Za-z]{2}|M\d{4}-\d{4})$/i.test(sleutel);
      };
      form?.addEventListener("input", sync);
      sync();
      form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(form);
        const { data, error } = await sb.rpc("boa_zoek_account", { p_sleutel: String(f.get("sleutel")).toUpperCase(), p_reden: f.get("reden") });
        fout = error ? error.message : "";
        dossier = data;
        melding = "";
        await laad30();
        teken();
      });
      document.getElementById("glas-aan")?.addEventListener("change", (e) => { glas = e.target.checked; teken(); });
      document.getElementById("glas")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const { data, error } = await sb.rpc("boa_nood_email", { p_email: f.get("email"), p_reden: f.get("reden") });
        fout = error ? error.message : "";
        dossier = data;
        glas = true;
        await laad30();
        teken();
      });
      document.getElementById("reset")?.addEventListener("click", async () => {
        const { data, error } = await sb.rpc("boa_reset_aanvragen", { p_client_id: dossier.client_id, p_reden: dossier.reden });
        if (error) { fout = error.message; teken(); return; }
        const res = await fetch("/.netlify/functions/reset", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` }, body: JSON.stringify({ verzoek: data.verzoek }) });
        const body = await res.json().catch(() => ({}));
        melding = res.ok ? "Herstel is aangevraagd. Het systeem mailt het geverifieerde adres. Dat adres is niet zichtbaar." : (body.fout || "Het verzoek staat in het auditlog. De mailfunctie is nog niet gekoppeld.");
        fout = "";
        teken();
      });
      document.getElementById("lock")?.addEventListener("click", async () => {
        const locked = !dossier.locked;
        const reden = dossier.reden || "Handmatige statuswijziging door hoofdbeheerder";
        const { data, error } = await sb.rpc("boa_account_locked", { p_client_id: dossier.client_id, p_locked: locked, p_reden: reden });
        if (error) { fout = error.message; teken(); return; }
        await fetch("/.netlify/functions/ban", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` }, body: JSON.stringify({ client_id: dossier.client_id, locked }) });
        dossier = data;
        melding = locked ? "Account vergrendeld en als kritieke wijziging gelogd." : "Account ontgrendeld en als kritieke wijziging gelogd.";
        teken();
      });
      document.getElementById("gebruiker")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/gebruiker", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ pv_naam: f.get("pv_naam"), email: f.get("email"), password: f.get("password") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Aanmaken lukt niet. Zet SUPABASE_SERVICE_ROLE_KEY in Netlify."; melding = ""; }
        else { fout = ""; melding = `Account ${body.pv_naam} · ${body.client_id}. Dit account kan in op boaportaal.nl, niet op de servicedesk.`; e.target.reset(); }
        teken();
      });
      document.getElementById("medewerker")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/medewerker", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ pv_naam: f.get("pv_naam"), email: f.get("email"), password: f.get("password"), rol: f.get("rol") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Aanmaken lukt niet. Zet SUPABASE_SERVICE_ROLE_KEY in Netlify."; melding = ""; }
        else { fout = ""; melding = `Medewerker ${body.pv_naam} · ${body.client_id} (${body.rol}). Dit account kan in op de servicedesk.`; e.target.reset(); }
        teken();
      });
      document.getElementById("filter")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        bronF = String(f.get("bron") || "");
        soortF = String(f.get("soort") || "");
        niveauF = String(f.get("niveau") || "");
        dagenF = String(f.get("dagen") || "30");
        qF = String(f.get("q") || "");
        teken();
      });
      document.getElementById("wachtwoord")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const password = String(f.get("password") || "");
        const again = String(f.get("again") || "");
        if (password.length < 12) { fout = "Het wachtwoord moet minimaal 12 tekens zijn."; melding = ""; teken(); return; }
        if (password !== again) { fout = "De twee wachtwoorden zijn niet gelijk."; melding = ""; teken(); return; }
        const res = await fetch("/.netlify/functions/wachtwoord", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ client_id: dossier.client_id, password, reden: f.get("reden") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Het wachtwoord is niet gezet."; melding = ""; }
        else { fout = ""; melding = "Het wachtwoord is gezet en als kritieke wijziging gelogd. Het wachtwoord staat niet in het log."; e.target.reset(); }
        teken();
      });
      document.getElementById("email")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/email", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ client_id: dossier.client_id, email: f.get("email"), reden: f.get("reden") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Het adres is niet gewijzigd."; melding = ""; }
        else { fout = ""; melding = "Het zakelijke adres is gewijzigd en als kritieke wijziging gelogd. Het adres blijft buiten beeld."; e.target.reset(); }
        teken();
      });
    }

    await vernieuw();
    teken();
  </script>
</body>
</html>
