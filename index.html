    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 ui-monospace, "Segoe UI", sans-serif; background:var(--veld); color:var(--tekst); }
    header { background:#020617; border-bottom:1px solid var(--lijn); padding:14px 18px; }
    header strong { letter-spacing:.06em; }
    main { max-width:1180px; margin:0 auto; padding:18px 14px 48px; }
    h1 { font-size:20px; margin:0 0 8px; }
    .kaart { background:var(--kaart); border:1px solid var(--lijn); padding:14px; margin-top:12px; }
    label { display:grid; gap:4px; margin-bottom:10px; color:var(--muted); font-size:12px; }
    input, select, textarea { font:inherit; color:var(--tekst); background:#020617; border:1px solid var(--lijn); padding:8px; width:100%; }
    textarea { min-height:80px; }
    .rij { display:flex; flex-wrap:wrap; gap:8px; }
    button { font:inherit; cursor:pointer; background:var(--actie); color:#fff; border:0; padding:8px 12px; }

    button:disabled { opacity:.4; cursor:not-allowed; }
    .balk { background:#7f1d1d; color:#fff; padding:12px; border:1px solid #fecaca; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; }

    table { width:100%; border-collapse:collapse; }
    tr.rijklik { cursor:pointer; }
    tr.rijklik:hover td { background:#1e293b; }
    th, td { border:1px solid var(--lijn); padding:6px; text-align:left; vertical-align:top; }
    .fout { color:var(--crit); } .ok { color:#86efac; }
    .tabs button.aan { outline:2px solid #fff; }

  <script>
    window.boaAanmelden = async (event) => {
      event.preventDefault();
      const form = event.target;
      const fout = document.getElementById("login-fout");
      const knop = form.querySelector("button");
      knop.disabled = true;
      fout.textContent = "Bezig met aanmelden…";
      try {
        const res = await fetch("/.netlify/functions/aanmelden", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sleutel: form.email.value.trim(), password: form.password.value }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.fout || "Aanmelden lukt niet.");
        sessionStorage.setItem("boa-login", JSON.stringify({
          access_token: body.access_token,
          refresh_token: body.refresh_token,
        }));
        location.reload();
      } catch (err) {
        fout.textContent = err.message || "Aanmelden lukt niet.";
        knop.disabled = false;
      }
      return false;
    };
  </script>

    async function vraagFactor(naam) {
      if (sessionStorage.getItem(`boa-ok-${naam}`) === "1") return "klaar";
      const lijst = await sb.auth.mfa.listFactors();
      if (lijst.error) return { fout: lijst.error.message || "Factoren niet op te vragen." };

      if (verified[0]) return { naam, modus: "code", factorId: verified[0].id, qr: "", geheim: "" };
      const vers = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: naam, issuer: naam === "beheer" ? "BOA Beheer" : "BOA Portaal" });
      if (vers.data?.totp?.qr_code) return { naam, modus: "setup", factorId: vers.data.id, qr: vers.data.totp.qr_code, geheim: vers.data.totp.secret || "" };
      const bericht = vers.error?.message || "Geen QR-code van het accountsysteem.";
      if (/aal2/i.test(bericht)) {
        const bestaand = (lijst.data?.totp || []).find((f) => f.status === "verified");
        if (bestaand) return { naam, modus: "poort", factorId: bestaand.id, qr: "", geheim: "", label: bestaand.friendly_name || "portaal" };
      }
      const bestaat = /already|exists|friendly|name/i.test(bericht);
      if (bestaat) {
        const open = (lijst.data?.all || []).find((f) => f.status !== "verified" && past(f));

    function qrSrc(qr) {
      if (!qr) return "";
      const ruw = String(qr);
      if (ruw.startsWith("data:image/svg+xml;base64,")) return ruw;
      let svg = ruw;
      const data = ruw.match(/^data:image\/svg\+xml(?:;charset=[^,]+)?(?:;utf-?8)?,(.*)$/i);
      if (data) svg = decodeURIComponent(data[1]);
      if (!svg.includes("<svg")) return ruw;
      return `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
    }

    function schil() {
      return `<div class="rij tabs">
        <button class="sec ${tab==="zoek"?"aan":""}" data-tab="zoek">Opvragen</button>
        <button class="sec ${tab==="mensen"?"aan":""}" data-tab="mensen">Accounts</button>
        <button class="sec ${tab==="audit"?"aan":""}" data-tab="audit">Audit</button>
        ${ik.rol === "beheerder" ? `<button class="sec ${tab==="blok"?"aan":""}" data-tab="blok">Blokkades</button>` : ""}
        <button class="sec" id="uit">Afmelden ${esc(ik.client_id)}</button>
      </div>
      <p>${esc(ik.rol)} · ${esc(ik.pv_naam)} · ${esc(ik.client_id)}</p>
      ${mfaLet ? `<p class="ok">${esc(mfaLet)}</p>` : ""}
      ${tab==="zoek" ? zoek() : tab==="mensen" ? medewerkers() : tab==="blok" ? blokHtml() : auditHtml()}`;

    function blokHtml() {
      const open = blokken.find((rij) => rij.referentie === blokOpen);
      return `<form id="blok-zoek" class="kaart">
        <h2>IP-blokkades</h2>
        <p>Zoek op de referentie van het rode scherm, of op het IP-adres. Alleen de hoofdbeheerder ziet waarom een adres dicht zit.</p>
        <label>Referentie of IP<input name="q" value="${esc(blokQ)}" placeholder="SOC- of 185."></label>
        <button>Zoeken</button>
      </form>
      <table><thead><tr><th>Referentie</th><th>IP</th><th>Status</th><th>Pogingen</th><th>Gezien op</th><th>Moment</th></tr></thead><tbody>
        ${blokken.length ? blokken.map((rij) => `<tr class="rijklik" data-ref="${esc(rij.referentie)}"><td>${esc(rij.referentie)}</td><td>${esc(rij.ip)}</td><td>${rij.actief ? "GEBLOKKEERD" : "vrij"}</td><td>${esc(rij.pogingen)}</td><td>${esc(rij.bron || "—")}</td><td>${esc(new Date(rij.gemaakt).toLocaleString("nl-NL"))}</td></tr>`).join("") : `<tr><td colspan="6">Geen blokkades.</td></tr>`}
      </tbody></table>
      ${open ? `<div class="kaart"><h2>${esc(open.referentie)}</h2>
        <p>IP ${esc(open.ip)} · ${open.actief ? "actief" : "opgeheven"} · door ${esc(open.door || "SOC")}</p>
        <p>${esc(open.reden)}</p>
        ${open.opgeheven ? `<p>Vrijgegeven ${esc(new Date(open.opgeheven).toLocaleString("nl-NL"))} door ${esc(open.opgeheven_door || "—")}.</p>` : `<button id="vrij" type="button" class="sec">Deblokkeren</button>`}
      </div>` : ""}
      <form id="blok-extra" class="kaart">
        <h2>Extra IP blokkeren</h2>
        <label>IP-adres<input name="ip" required placeholder="185.0.0.0"></label>
        <label>Waarom<textarea name="reden" required minlength="12" placeholder="Zelfde persoon, ander adres na SOC-referentie"></textarea></label>
        <button>Blokkeren</button>
      </form>`;
    }

    async function ipBeheer(body) {
      const res = await fetch("/.netlify/functions/ip", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.fout || "De blokkade is niet opgehaald.");
      return data;
    }

    async function inlogLijst(extra) {
      const headers = { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` };
      const res = await fetch("/.netlify/functions/inlog", {
        method: "POST",
        headers,
        body: JSON.stringify({ actie: "lijst", ...extra }),
      });
      return res.json().catch(() => ({}));
    }

    async function laad30() {
      if (!dossier?.client_id) return;
      const { data, error } = await sb.rpc("boa_dossier_30", { p_client_id: dossier.client_id });
      const lijst = await inlogLijst({ client_id: dossier.client_id, dagen: 30 });
      if (error && !lijst.inlog) {
        dossier.inlog = [];
        dossier.handelingen = [];
        dossier.auditFout = error.message.includes("function") ? "Draai migrations/0005_audit_inlog.sql in Supabase." : error.message;
        return;
      }
      dossier.inlog = lijst.inlog || data?.inlog || [];
      dossier.handelingen = data?.handelingen || [];
      dossier.ip_zichtbaar = Boolean(lijst.ip_zichtbaar ?? data?.ip_zichtbaar);
      dossier.auditFout = lijst.fout && !lijst.inlog ? lijst.fout : "";
    }

    function noteerInlog(token, email) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = `Bearer ${token}`;
      void fetch("/.netlify/functions/inlog", { method: "POST", headers, body: JSON.stringify({ bron: "systeem", email: email || "" }) });
    }

    async function token() {
      const { data } = await sb.auth.getSession();
      return data.session?.access_token || "";
    }

    async function teken() {
      app.dataset.klaar = "1";
      if (factor) { app.innerHTML = factorHtml(); bind(); return; }
      if (!ik) { app.innerHTML = login(); bind(); return; }
      if (!ik.medewerker) {
        app.innerHTML = `<div class="kaart"><h1>Geen toegang</h1><p>${esc(ik.pv_naam)} ${esc(ik.client_id)} is geen medewerker. Een hoofdbeheerder maakt het account aan.</p><button id="uit">Afmelden</button></div>`;
        document.getElementById("uit").onclick = async () => { await sb.auth.signOut(); ik = null; teken(); };
        return;
      }
      if (tab === "audit") {
        const { data, error } = await sb.rpc("boa_overzicht", {
          p_bron: bronF,
          p_soort: soortF,
          p_niveau: niveauF,
          p_dagen: Number(dagenF),
          p_q: qF,
        });
        const ongefilterd = !bronF && !soortF && !niveauF && !qF;
        const leeg = !data || ((!data.register || !data.register.length) && (!data.inlog || !data.inlog.length));
        if (error || (ongefilterd && leeg)) {
          const oud = await sb.rpc("boa_audit_lijst");
          if (!oud.error && Array.isArray(oud.data) && oud.data.length) {
            overzicht = { ip_zichtbaar: ik.rol === "beheerder", inlog: data?.inlog || [], register: oud.data };
            fout = "";
          } else if (error) {
            fout = error.message.includes("function") ? "Draai schema-0005.sql in Supabase." : error.message;
          } else if (data) {
            overzicht = data;
            fout = "";
          }
        } else {
          overzicht = data;
          fout = "";
        }
        const lijst = await inlogLijst({ dagen: Number(dagenF), bron: bronF, q: qF });
        if (lijst.inlog) {
          overzicht = { ...(overzicht || {}), inlog: lijst.inlog, ip_zichtbaar: Boolean(lijst.ip_zichtbaar), register: overzicht?.register || data?.register || [] };
          fout = "";
        } else if (lijst.fout && !(overzicht?.inlog || []).length) {
          fout = lijst.fout;
        }
      }
      if (tab === "blok" && ik.rol === "beheerder") {
        try {
          const data = await ipBeheer({ actie: blokQ ? "zoek" : "lijst", q: blokQ });
          blokken = data.blokken || [];
        } catch (err) {
          fout = err.message;
          blokken = [];
        }
      } else if (tab === "blok") {
        tab = "zoek";
      }
      app.innerHTML = schil();
      bind();
    }

    function bind() {
      document.getElementById("uit")?.addEventListener("click", async () => { sessionStorage.removeItem("boa-ok-beheer"); await sb.auth.signOut(); ik = null; dossier = null; factor = null; teken(); });
      document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; fout = ""; melding = ""; teken(); }));
      document.getElementById("blok-zoek")?.addEventListener("submit", (e) => {
        e.preventDefault();
        blokQ = String(new FormData(e.target).get("q") || "").trim();
        blokOpen = "";
        teken();
      });
      document.querySelectorAll("[data-ref]").forEach((rij) => rij.addEventListener("click", () => { blokOpen = rij.dataset.ref; teken(); }));
      document.getElementById("vrij")?.addEventListener("click", async () => {
        try {
          await ipBeheer({ actie: "vrij", referentie: blokOpen });
          melding = `${blokOpen} is vrijgegeven.`;
          fout = "";
          teken();
        } catch (err) { fout = err.message; teken(); }
      });
      document.getElementById("blok-extra")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        try {
          const data = await ipBeheer({ actie: "blokkeer", ip: f.get("ip"), reden: f.get("reden") });
          melding = `${data.blok.ip} staat dicht onder ${data.blok.referentie}.`;
          fout = "";
          blokQ = data.blok.referentie;
          blokOpen = data.blok.referentie;
          teken();
        } catch (err) { fout = err.message; teken(); }
      });
      const form = document.getElementById("zoek");
      const knop = document.getElementById("zoek-knop");
      const sync = () => {
        if (!form || !knop) return;
        const sleutel = form.sleutel.value.trim();
        const reden = form.reden.value.trim();
        knop.disabled = reden.length < 12 || !/^(BP-\d{4}-[A-Za-z]{2}|M\d{4}-\d{4}|AN-[A-Za-z0-9]{6})$/i.test(sleutel);
      };
      form?.addEventListener("input", sync);
      sync();
      form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(form);
        const sleutel = String(f.get("sleutel")).trim().toUpperCase();
        const anoniem = sleutel.startsWith("AN-");
        const { data, error } = await sb.rpc(anoniem ? "boa_anon_opzoek" : "boa_zoek_account", anoniem
          ? { p_code: sleutel, p_reden: f.get("reden") }
          : { p_sleutel: sleutel, p_reden: f.get("reden") });
        fout = error ? error.message : "";
        dossier = data;
        melding = "";
        await laad30();
        await verrijkSlot();
        teken();
      });
      document.getElementById("glas-aan")?.addEventListener("change", (e) => { glas = e.target.checked; teken(); });
      document.getElementById("glas")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const { data, error } = await sb.rpc("boa_nood_email", { p_email: f.get("email"), p_reden: f.get("reden") });
        fout = error ? error.message : "";
        dossier = data;
        glas = true;
        await laad30();
        teken();
      });
      document.getElementById("reset")?.addEventListener("click", async () => {
        const { data, error } = await sb.rpc("boa_reset_aanvragen", { p_client_id: dossier.client_id, p_reden: dossier.reden });
        if (error) { fout = error.message; teken(); return; }
        const res = await fetch("/.netlify/functions/reset", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` }, body: JSON.stringify({ verzoek: data.verzoek }) });
        const body = await res.json().catch(() => ({}));
        melding = res.ok ? "Herstel is aangevraagd. Het systeem mailt het geverifieerde adres. Dat adres is niet zichtbaar." : (body.fout || "Het verzoek staat in het auditlog. De mailfunctie is nog niet gekoppeld.");
        fout = "";
        teken();
      });
      document.getElementById("lock")?.addEventListener("click", async () => {
        const locked = document.getElementById("lock").dataset.dicht === "1";
        const reden = dossier.reden || (locked ? "Handmatige vergrendeling door hoofdbeheerder" : "Ontgrendeld na ticket door support of beheer");
        const res = await fetch("/.netlify/functions/ban", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ client_id: dossier.client_id, locked, reden }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Vergrendelen lukt niet."; teken(); return; }
        dossier.locked = locked;
        dossier.slot_tot = null;
        dossier.slot_straf = false;
        melding = locked ? "Account permanent vergrendeld en gelogd." : "Account ontgrendeld. De teller staat weer op nul.";
        fout = "";
        teken();
      });
      document.getElementById("gebruiker")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/gebruiker", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ pv_naam: f.get("pv_naam"), email: f.get("email"), password: f.get("password") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Aanmaken lukt niet. Zet SUPABASE_SERVICE_ROLE_KEY in Netlify."; melding = ""; }
        else { fout = ""; melding = `Account ${body.pv_naam} · ${body.client_id}. Dit account kan in op boaportaal.nl, niet op de servicedesk.`; e.target.reset(); }
        teken();
      });
      document.getElementById("medewerker")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/medewerker", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ pv_naam: f.get("pv_naam"), sleutel: f.get("sleutel"), password: f.get("password"), rol: f.get("rol"), postbus: f.get("postbus"), whatsapp: f.get("whatsapp") === "on" }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Uitnodigen lukt niet. Zet SUPABASE_SERVICE_ROLE_KEY in Netlify."; melding = ""; }
        else { fout = ""; melding = body.mail ? `${body.pv_naam} · ${body.client_id} is uitgenodigd. De mail naar de medewerkersportalen is verstuurd.` : `${body.pv_naam} · ${body.client_id} staat erin. ${body.mailFout || "De uitnodigingsmail is niet verstuurd."}`; e.target.reset(); }
        teken();
      });
      document.getElementById("whatsapp")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/medewerker", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ actie: "whatsapp", sleutel: f.get("sleutel"), aan: f.get("aan") === "on" }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Opslaan lukt niet."; melding = ""; }
        else { fout = ""; melding = body.whatsapp ? `${body.pv_naam} · ${body.client_id} mag in de WhatsApp-inbox.` : `${body.pv_naam} · ${body.client_id} heeft geen WhatsApp-toegang meer.`; }
        teken();
      });
      document.getElementById("redactie")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/medewerker", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ actie: "redactie", sleutel: f.get("sleutel"), feit: f.get("feit") === "on", boom: f.get("boom") === "on", jargon: f.get("jargon") === "on", trainer: f.get("trainer") === "on" }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Opslaan mislukt."; melding = ""; teken(); return; }
        fout = "";
        melding = `${body.pv_naam} · ${body.client_id}: feitcodes ${aanUit(body.mag_feit)}, beslisbomen ${aanUit(body.mag_boom)}, vakjargon ${aanUit(body.mag_jargon)}, trainer ${aanUit(body.mag_trainer)}.`;
        teken();
      });
      document.getElementById("filter")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        bronF = String(f.get("bron") || "");
        soortF = String(f.get("soort") || "");
        niveauF = String(f.get("niveau") || "");
        dagenF = String(f.get("dagen") || "30");
        qF = String(f.get("q") || "");
        teken();
      });
      document.getElementById("wachtwoord")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const password = String(f.get("password") || "");
        const again = String(f.get("again") || "");
        if (password.length < 12) { fout = "Het wachtwoord moet minimaal 12 tekens zijn."; melding = ""; teken(); return; }
        if (password !== again) { fout = "De twee wachtwoorden zijn niet gelijk."; melding = ""; teken(); return; }
        const res = await fetch("/.netlify/functions/wachtwoord", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ client_id: dossier.client_id, password, reden: f.get("reden") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Het wachtwoord is niet gezet."; melding = ""; }
        else { fout = ""; melding = "Het wachtwoord is gezet en als kritieke wijziging gelogd. Het wachtwoord staat niet in het log."; e.target.reset(); }
        teken();
      });
      document.getElementById("email")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/email", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ client_id: dossier.client_id, email: f.get("email"), reden: f.get("reden") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "Het adres is niet gewijzigd."; melding = ""; }
        else { fout = ""; melding = "Het zakelijke adres is gewijzigd en als kritieke wijziging gelogd. Het adres blijft buiten beeld."; e.target.reset(); }
        teken();
      });
      document.getElementById("postbus")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const res = await fetch("/.netlify/functions/postbus", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}` },
          body: JSON.stringify({ client_id: dossier.client_id, postbus: f.get("postbus"), reden: f.get("reden") }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { fout = body.fout || "De postbus is niet gekoppeld."; melding = ""; }
        else { fout = ""; melding = `Postbus ${body.postbus} is gekoppeld. De beheer-authenticator geldt nu ook voor die mail.`; e.target.reset(); }
        teken();
      });
      document.getElementById("factor")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const code = String(new FormData(e.target).get("code") || "").replace(/\s/g, "");
        const poort = factor.modus === "poort";
        const uitdaging = await sb.auth.mfa.challenge({ factorId: factor.factorId });
        if (uitdaging.error || !uitdaging.data) { fout = "De code kon niet worden gevraagd. Probeer het opnieuw."; teken(); return; }
        const check = await sb.auth.mfa.verify({ factorId: factor.factorId, challengeId: uitdaging.data.id, code });
        if (check.error) { fout = "Die code klopt niet."; teken(); return; }
        if (poort) {
          factor = null;
          fout = "";
          const uit = await vraagFactor("beheer");
          if (uit && uit.fout) mfaLet = "Tweestaps kon niet starten: " + uit.fout;
          else if (uit !== "klaar") factor = uit;
          teken();
          return;
        }
        sessionStorage.setItem("boa-ok-beheer", "1");
        factor = null;
        fout = "";
        mfaLet = "";
        const sessie = await sb.auth.getSession();
        noteerInlog(sessie.data.session?.access_token || "", "");
        await vernieuw();
        teken();
      });
    }

    app.dataset.klaar = "1";
    const vers = sessionStorage.getItem("boa-login");
    if (vers) {
      sessionStorage.removeItem("boa-login");
      try {
        const tokens = JSON.parse(vers);
        const gezet = await sb.auth.setSession(tokens);
        if (gezet.error) fout = gezet.error.message;
      } catch (err) {
        fout = err.message || "De sessie kon niet worden gezet.";
      }
    }
    try {
      await Promise.race([
        vernieuw(),
        new Promise((_, reject) => setTimeout(() => reject(new Error("Het accountsysteem reageert niet.")), 6000)),
      ]);
    } catch (err) {
      ik = null;
      fout = err.message || "Het accountsysteem reageert niet.";
    }
    if (ik?.medewerker) {
      try {
        const uit = await vraagFactor("beheer");
        if (uit && uit.fout) mfaLet = "Tweestaps kon niet starten: " + uit.fout;
        else if (uit !== "klaar") factor = uit;
      } catch (err) {
        mfaLet = "Tweestaps kon niet starten: " + (err?.message || "onbekend");
      }
    }
    teken();
  </script>
